<script>
(function(){
var btns=document.querySelectorAll('.themebtn');
function syncLinks(t){
document.querySelectorAll('a[href]').forEach(function(a){
var href=a.getAttribute('href');
if(!href||href.charAt(0)==='#')return;
try{
var url=new URL(href,location.href);
url.searchParams.set('theme',t);
a.setAttribute('href',url.href);
}catch(e){}
});
}
function label(){var t=document.documentElement.getAttribute('data-theme')||'dark';var txt=t==='light'?'Dark mode':'Light mode';btns.forEach(function(b){b.textContent=txt;});syncLinks(t);}
label();
window.__resyncThemeLinks = function(){ syncLinks(document.documentElement.getAttribute('data-theme')||'dark'); };
btns.forEach(function(btn){btn.addEventListener('click',function(){
var cur=document.documentElement.getAttribute('data-theme');
var next=cur==='light'?'dark':'light';
document.documentElement.setAttribute('data-theme',next);
try{localStorage.setItem('bcscTheme',next);}catch(e){}
label();
});});
})();
</script>
<script>
/* ============================================================
   REVIEWER CONFIG — this is the ONLY part to edit when adding
   a new reviewer. See SITE_GUIDE.md in the repo root for the
   full step-by-step instructions and rules.

   Each group: { id, name, meta, note, password, sections }
     - id:       short unique slug, used for element ids only
     - password: null for open groups, or
                 { hash: "<sha256 hex of password>", storeKey: "<localStorage key remembering unlock>" }
     - sections: one entry per page:
         { file, label, count, key }
         - file:  path relative to this index.html
         - label: display name
         - count: number of questions (shown + used for progress %)
         - key:   the page's localStorage progress key — MUST match
                  the key inside that page's own save()/load() code.
                  NEVER change an existing key.
   ============================================================ */
var REVIEWERS = [
  {
    id: "bcsc",
    name: "BCSC Question Bank",

    note: "Split into subspecialty sections so each page loads quickly. Works on desktop and phone.",

      {file:"bcsc-qbank/Neuro.html",        label:"Neuro-Ophthalmology",                           count:400, key:"bcscanki_neuro"},
      {file:"bcsc-qbank/Peds.html",         label:"Pediatric Ophthalmology & Strabismus",          count:438, key:"bcscanki_peds-strabismus"},
      {file:"bcsc-qbank/Plastics.html",     label:"Oculofacial Plastic & Orbital Surgery",         count:431, key:"bcscanki_plastics-orbit"},
      {file:"bcsc-qbank/Cornea.html",       label:"External Disease & Cornea",                     count:422, key:"bcscanki_cornea"},
      {file:"bcsc-qbank/Uveitis.html",      label:"Uveitis & Ocular Inflammation",                 count:338, key:"bcscanki_uveitis"},
      {file:"bcsc-qbank/Glaucoma.html",     label:"Glaucoma",                                      count:293, key:"bcscanki_glaucoma"},
      {file:"bcsc-qbank/Cataract.html",     label:"Lens & Cataract",                               count:265, key:"bcscanki_cataract"},
      {file:"bcsc-qbank/Retina.html",       label:"Retina & Vitreous",                             count:365, key:"bcscanki_retina"},
      {file:"bcsc-qbank/Refractive.html",   label:"Refractive Surgery",                            count:208, key:"bcscanki_refractive"}
    ]
  },
  {
    id: "ou",
    name: "Oculus Uterque Reviewer",
    meta: "2,263 questions \u00b7 5 sections",
    note: "Split by source exam so each page loads quickly. Works on desktop and phone.",
    password: { hash: "7db281db8552d8a16756e25b61d114dec16b7b71b2613872d882d8abd1cb2785", storeKey: "ouUnlocked_lebers" },
    sections: [
      {file:"oculus-uterque/Midterms2024.html",            label:"Midterms 2024",                count:91,   key:"oculus_uterque_midterms2024_v1"},
      {file:"oculus-uterque/Midterms2025.html",            label:"Midterms 2025",                count:100,  key:"oculus_uterque_midterms2025_v1"},
      {file:"oculus-uterque/Salamander2025.html",          label:"Salamander 2025 (Module 1-4)", count:360,  key:"oculus_uterque_salamander2025_v1"},
      {file:"oculus-uterque/Salamander2026.html",          label:"Salamander 2026 (Module 1-4)", count:395,  key:"oculus_uterque_salamander2026_v1"},
      {file:"oculus-uterque/BrainDiarrheaMasterfile.html", label:"Brain Diarrhea Masterfile",    count:1317, key:"oculus_uterque_masterfile_v1"}

/* ---- rendering + gate + progress (no need to edit below) ---- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function sectionCardHtml(sec){
  return '<a class="seccard" href="'+esc(sec.file)+'" data-key="'+esc(sec.key)+'" data-total="'+sec.count+'">'
    +'<div class="secname">'+esc(sec.label)+'</div>'
    +'<div class="seccount">'+sec.count.toLocaleString()+' questions</div>'
    +'<div class="secprogress"><div class="secprogress-fill"></div></div>'
    +'<div class="secprogress-label">Not started</div></a>';
}

function renderGroups(){
  var root = document.getElementById('groups');
  root.innerHTML = '';
  REVIEWERS.forEach(function(g){
    var div = document.createElement('div');
    div.className = 'group';
    div.id = 'group-' + g.id;
    var locked = false;
    if(g.password){
      try{ locked = localStorage.getItem(g.password.storeKey) !== '1'; }catch(e){ locked = true; }
    }
    var metaHtml = locked ? '&#128274; Password required'
                         : esc(g.meta) + '<span class="overallprog" id="overall-'+g.id+'"></span>';
    var noteHtml = locked ? 'Enter the password to view this reviewer.' : esc(g.note);
    var inner = '<div class="grouphead"><div class="groupname">'+esc(g.name)+'</div>'
      +'<div class="groupmeta" id="meta-'+g.id+'">'+metaHtml+'</div></div>'
      +'<div class="groupnote" id="note-'+g.id+'">'+noteHtml+'</div>';
    if(locked){
      inner += '<div class="gatebox" id="gate-'+g.id+'">'
        +'<input type="password" id="pass-'+g.id+'" placeholder="Password" autocomplete="off">'
        +'<button class="gatebtn" type="button" id="unlock-'+g.id+'">Unlock</button>'
        +'<div class="gateerr" id="gateerr-'+g.id+'"></div></div>'
        +'<div class="secgrid hidden" id="grid-'+g.id+'"></div>';
    } else {
      inner += '<div class="secgrid" id="grid-'+g.id+'">'+g.sections.map(sectionCardHtml).join('')+'</div>';
    }
    div.innerHTML = inner;
    root.appendChild(div);
    if(locked) wireGate(g);
  });
  if(window.__resyncThemeLinks) window.__resyncThemeLinks();
  refreshProgress();
}

function sha256hex(str){
  var enc = new TextEncoder().encode(str);
  return crypto.subtle.digest('SHA-256', enc).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){return b.toString(16).padStart(2,'0');}).join('');
  });
}

function wireGate(g){
  var input = document.getElementById('pass-'+g.id),
      btn = document.getElementById('unlock-'+g.id),
      err = document.getElementById('gateerr-'+g.id);
  function tryUnlock(){
    var val = input.value;
    if(!val) return;
    sha256hex(val).then(function(hex){
      if(hex === g.password.hash){
        try{ localStorage.setItem(g.password.storeKey,'1'); }catch(e){}
        document.getElementById('gate-'+g.id).classList.add('hidden');
        var grid = document.getElementById('grid-'+g.id);
        grid.innerHTML = g.sections.map(sectionCardHtml).join('');
        grid.classList.remove('hidden');
        document.getElementById('meta-'+g.id).innerHTML = esc(g.meta)+'<span class="overallprog" id="overall-'+g.id+'"></span>';
        document.getElementById('note-'+g.id).textContent = g.note;
        if(window.__resyncThemeLinks) window.__resyncThemeLinks();
        refreshProgress();
      } else {
        err.textContent = 'Incorrect password.';
        input.value = '';
      }
    }).catch(function(){ err.textContent = 'Unlock unavailable in this browser.'; });
  }
  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
}

function countAnswered(raw){
  if(!raw) return 0;
  try{
    var parsed = JSON.parse(raw);
    if(parsed && typeof parsed === 'object' && parsed.state && typeof parsed.state === 'object'){
      return Object.keys(parsed.state).length;
    }
    return Object.keys(parsed).length;
  }catch(e){ return 0; }
}
function readStats(key){
  try{
    var raw = localStorage.getItem(key + '_stats');
    if(!raw) return null;
    var parsed = JSON.parse(raw);
    if(parsed && typeof parsed.ans === 'number' && typeof parsed.cor === 'number') return parsed;
  }catch(e){}
  return null;
}
function scoreTier(pct){
  if(pct < 50) return 'low';
  if(pct < 70) return 'mid';
  return 'high';
}
function scoreBadge(pct){
  return '<span class="scorebadge ' + scoreTier(pct) + '">' + pct + '%</span>';
}
function refreshProgress(){
  REVIEWERS.forEach(function(g){
    var groupEl = document.getElementById('group-'+g.id);
    if(!groupEl) return;
    var totalAll = 0, answeredAll = 0, corAll = 0, scoredAll = 0;
    groupEl.querySelectorAll('.seccard[data-key]').forEach(function(card){
      var key = card.getAttribute('data-key');
      var total = parseInt(card.getAttribute('data-total'), 10) || 0;
      var answered = countAnswered(localStorage.getItem(key));
      if(answered > total) answered = total;
      totalAll += total;
      answeredAll += answered;
      var pct = total ? Math.round(answered/total*100) : 0;
      var fill = card.querySelector('.secprogress-fill');
      var label = card.querySelector('.secprogress-label');
      var stats = readStats(key);
      var badgeHtml = '';
      if(stats && stats.ans > 0){
        var scorePct = Math.round(stats.cor/stats.ans*100);
        badgeHtml = scoreBadge(scorePct);
        corAll += stats.cor;
        scoredAll += stats.ans;
      }
      if(fill) fill.style.width = pct + '%';
      if(label) label.innerHTML = answered === 0 ? 'Not started' : (answered + ' / ' + total + ' answered (' + pct + '%)' + badgeHtml);
      if(answered >= total && total > 0){ card.classList.add('done'); } else { card.classList.remove('done'); }
    });
    var overall = document.getElementById('overall-'+g.id);
    if(overall && totalAll){
      var overallPct = Math.round(answeredAll/totalAll*100);
      var overallBadge = scoredAll > 0 ? scoreBadge(Math.round(corAll/scoredAll*100)) : '';
      overall.innerHTML = answeredAll.toLocaleString() + ' / ' + totalAll.toLocaleString() + ' answered overall (' + overallPct + '%)' + overallBadge;
    }
  });
}

renderGroups();
</script>
<script>
(function(){
var msg = document.getElementById('backupMsg');
function setMsg(t){ msg.textContent = t; if(t) setTimeout(function(){ msg.textContent=''; }, 6000); }

document.getElementById('exportAllBtn').addEventListener('click', function(){
  try{
    var data = {};
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      data[k] = localStorage.getItem(k);
    }
    var payload = {
      site: "lebers-learning",
      exported: new Date().toISOString(),
      keys: Object.keys(data).length,
      data: data
    };
    var blob = new Blob([JSON.stringify(payload, null, 1)], {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lebers-learning-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setMsg('Backup downloaded (' + payload.keys + ' items).');
  }catch(e){ setMsg('Export failed: ' + e.message); }
});

document.getElementById('importAllBtn').addEventListener('click', function(){
  document.getElementById('importAllFile').click();
});
document.getElementById('importAllFile').addEventListener('change', function(ev){
  var file = ev.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var payload = JSON.parse(reader.result);
      if(!payload || payload.site !== 'lebers-learning' || typeof payload.data !== 'object'){
        setMsg('Not a valid Leber\u2019s Learning backup file.');
        return;
      }
      var n = Object.keys(payload.data).length;
      if(!confirm('Restore backup from ' + (payload.exported||'unknown date') + '? This will overwrite matching saved progress on this device (' + n + ' items).')) return;
      for(var k in payload.data){
        try{ localStorage.setItem(k, payload.data[k]); }catch(e){}
      }
      setMsg('Restored ' + n + ' items. Reloading\u2026');
      setTimeout(function(){ location.reload(); }, 800);
    }catch(e){ setMsg('Import failed: ' + e.message); }
  };
  reader.readAsText(file);
  ev.target.value = '';
});
})();
</script>
